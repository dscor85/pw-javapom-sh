# Self-healing configuration. Never put an API key on this file or in source code --
# self.healing.ai.api.key.env names an ENVIRONMENT VARIABLE that holds the key instead.

self.healing.enabled=true
self.healing.output.dir=./self-healing-reports
self.healing.max.attempts=1

# Built-in OpenAI-compatible HTTP provider settings (used when self.healing.ai.provider.class is blank)
self.healing.ai.endpoint=https://api.groq.com/openai/v1/chat/completions
self.healing.ai.model=openai/gpt-oss-120b
self.healing.ai.api.key.env=GROQ_API_KEY

# Leave blank to use the built-in OpenAI-compatible provider.
# Set to a fully-qualified class name (implementing AiLocatorProvider, no-arg constructor)
# to use a custom provider instead.
self.healing.ai.provider.class=
